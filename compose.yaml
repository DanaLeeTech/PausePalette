services:
  # The static GUI: http://localhost:8000
  web:
    build: .
    image: ghcr.io/danaleetech/pausepalette:latest
    # `.env` PAUSELETTE_UI=0 leaves the GUI out (command-line-only setup)
    deploy:
      replicas: ${PAUSELETTE_UI:-1}
    ports:
      - "${PAUSELETTE_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # The CLI: docker compose run --rm cli plan Foo.3mf --slots 4 -o Foo_pausepalette.3mf
  cli:
    build: .
    image: ghcr.io/danaleetech/pausepalette:latest
    profiles: ["cli"]
    entrypoint: pausepalette
    working_dir: /work
    volumes:
      # the folder you run it from, so it reads and writes your files directly
      - "${PWD:-.}:/work"
    # your own uid/gid, so files the CLI writes in the folder are yours
    user: "${PAUSELETTE_UID:-1000}:${PAUSELETTE_GID:-1000}"
