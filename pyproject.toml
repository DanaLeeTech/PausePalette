[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pausepalette"
version = "0.1.0"
description = "Offline colour planning and manual-swap pause insertion for Bambu/Orca AMS prints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-playwright>=0.5", "pillow>=10"]

[project.scripts]
pausepalette = "pausepalette.cli:main"

[tool.setuptools]
packages = ["pausepalette", "pausepalette.dialects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
